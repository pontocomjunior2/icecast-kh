version: '3.8'

services:
  icecast:
    build: .
    container_name: icecast-kh
    # Limita o log do Docker para não crescer infinitamente
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ICECAST_SOURCE_PASSWORD
      - ICECAST_RELAY_PASSWORD
      - ICECAST_ADMIN_USER
      - ICECAST_ADMIN_PASSWORD
      - ICECAST_HOSTNAME=localhost
      - ICECAST_LOCATION=Brazil
      - ICECAST_ADMIN_EMAIL=webmaster@localhost
      - ICECAST_CLIENTS=1000
      - ICECAST_SOURCES=100
      - ICECAST_WEB_PORT=80
      - ICECAST_SOURCE_PORT=9000
      # Reduzimos o log level (4 é muito detalhado, 1 ou 2 é o ideal para produção)
      - ICECAST_LOG_LEVEL=2
    ports:
      - "9000:9000"
    restart: always
